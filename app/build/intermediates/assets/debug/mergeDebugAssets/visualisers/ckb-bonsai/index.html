<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CKB Bonsai Cell Visualizer — Japanese Maple Live Monitor</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(14, 18, 26, 0.85);
      --card-border: rgba(212, 160, 106, 0.3);
      --accent-crimson: #d32f2f;
      --accent-maple: #e65100;
      --accent-gold: #e5a93c;
      --accent-teal: #4db6ac;
      --text-main: #f5eedb;
      --text-muted: #a39b8b;
      --font-serif: 'Georgia', 'Songti SC', 'Noto Serif JP', serif;
      --font-mono: 'SF Mono', 'Roboto Mono', 'Cascadia Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-serif);
      color: var(--text-main);
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      touch-action: none;
    }

    /* HUD Overlay */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
    }

    .interactive {
      pointer-events: auto;
    }

    /* Top Bar */
    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .title-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 8px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .title-japanese {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent-gold);
      font-weight: 600;
      text-transform: uppercase;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-crimson);
      box-shadow: 0 0 8px var(--accent-crimson);
      transition: background 0.3s;
    }
    .pulse-dot.live { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
    .pulse-dot.error { background: #f44336; box-shadow: 0 0 8px #f44336; }

    .block-status {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .block-lbl {
      font-size: 9px;
      color: var(--text-muted);
      font-weight: normal;
    }

    .action-icons {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.15s, border-color 0.2s;
    }
    .icon-btn:active {
      transform: scale(0.92);
      border-color: var(--accent-gold);
    }
    .icon-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    /* Announcement Banner */
    .zen-banner {
      align-self: center;
      background: rgba(14, 18, 26, 0.92);
      border: 1px solid var(--accent-gold);
      box-shadow: 0 0 30px rgba(229, 169, 60, 0.25);
      border-radius: 20px;
      padding: 10px 24px;
      text-align: center;
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      max-width: 90%;
    }
    .zen-banner.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .banner-kanji {
      font-size: 11px;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      margin-bottom: 2px;
    }
    .banner-main {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      font-family: var(--font-mono);
    }
    .banner-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Bottom Bar */
    .footer-panel {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8px;
    }

    .cells-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .cells-num {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-gold);
    }
    .cells-lbl {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .zen-quote {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      letter-spacing: 0.5px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 5px 12px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
    }

    /* Modal Sheet */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #10141d;
      border: 1px solid var(--accent-gold);
      box-shadow: 0 0 35px rgba(229, 169, 60, 0.25);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 320px;
      font-family: var(--font-mono);
      transform: scale(0.94);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.open .modal-box {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(229, 169, 60, 0.25);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .modal-title {
      font-size: 11px;
      color: var(--accent-gold);
      letter-spacing: 1.5px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 2px 6px;
    }

    .setting-item {
      margin-bottom: 12px;
    }
    .setting-lbl {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .setting-field {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .setting-field:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .modal-action-btn {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 700;
    }
    .modal-action-btn.primary {
      background: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      color: #0d1117;
    }
    .modal-action-btn.secondary {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    /* Pixel Watch 3 / Round Viewport Adaptation */
    @media (shape: round), screen and (max-aspect-ratio: 1/1) and (max-width: 480px) {
      .hud-layer {
        padding: 24px 16px 20px 16px;
      }
      .header-panel {
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      .title-card {
        padding: 4px 12px;
        border-radius: 20px;
      }
      .action-icons {
        position: absolute;
        bottom: 22px;
        right: 18px;
      }
      .footer-panel {
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      .zen-quote {
        display: none;
      }
    }
  </style>
  <!-- Three.js (Local bundle with CDN fallback) -->
  <script src="three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <!-- 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- HUD Overlay -->
  <div class="hud-layer">
    <!-- Header -->
    <header class="header-panel">
      <div class="title-card interactive" id="statusCard">
        <div class="title-japanese">
          <span class="pulse-dot" id="statusDot"></span>
          <span>CKB BONSAI VISUALIZER</span>
        </div>
        <div class="block-status">
          <span class="block-lbl">TIP</span>
          <span id="blockNumber">#------</span>
        </div>
      </div>

      <div class="action-icons interactive">
        <button class="icon-btn" id="audioBtn" title="Toggle Ambience Sound" aria-label="Audio">
          <svg id="audioIconOff" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          <svg id="audioIconOn" style="display:none;" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Node Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </header>

    <!-- Center Zen Event Banner -->
    <div class="zen-banner" id="zenBanner">
      <div class="banner-kanji" id="bannerKanji">NEW BLOCK COMMIT</div>
      <div class="banner-main" id="bannerMain">42 NEW CELLS</div>
      <div class="banner-sub" id="bannerSub">AUTUMN LEAVES FALLING</div>
    </div>

    <!-- Footer -->
    <footer class="footer-panel">
      <div class="cells-pill interactive">
        <span class="cells-lbl">FALLING LEAVES</span>
        <span class="cells-num" id="cellsCount">0</span>
      </div>

      <div class="zen-quote">
        "Every cell born, a leaf adrift in harmony"
      </div>
    </footer>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">CKB NODE CONFIG</span>
        <button class="close-btn" id="closeSettingsBtn">&times;</button>
      </div>
      <div class="setting-item">
        <div class="setting-lbl">HTTP RPC URL</div>
        <input type="text" class="setting-field" id="rpcInput" value="https://mainnet.ckb.dev/">
      </div>
      <div class="setting-item">
        <div class="setting-lbl">WEBSOCKET RPC URL (OPTIONAL)</div>
        <input type="text" class="setting-field" id="wsInput" placeholder="wss://... (auto-derived if blank)">
      </div>
      <div class="btn-row">
        <button class="modal-action-btn secondary" id="testBlockBtn">TEST BLOCK</button>
        <button class="modal-action-btn primary" id="saveRpcBtn">SAVE &amp; CONNECT</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       CKB BONSAI CELL VISUALIZER — THREE.JS ENGINE
       ========================================================================== */

    const CONFIG = {
      defaultHttpRpc: 'https://mainnet.ckb.dev/',
      fallbackHttpRpc: 'https://mainnet.ckbapp.dev/',
      pollIntervalMs: 7000
    };

    // --------------------------------------------------------------------------
    // 1. ZEN AUDIO SYNTHESIZER (Web Audio API)
    // --------------------------------------------------------------------------
    class ZenAudio {
      constructor() {
        this.ctx = null;
        this.enabled = false;
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          this.ctx = new AudioContext();
        }
      }

      toggle() {
        this.init();
        if (!this.ctx) return false;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.enabled = !this.enabled;
        return this.enabled;
      }

      playTempleBell() {
        if (!this.ctx || !this.enabled) return;
        try {
          const now = this.ctx.currentTime;
          // Resonant Japanese temple chime
          const freqs = [440, 880, 1320, 1760];
          freqs.forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now);
            const decay = 1.2 + idx * 0.4;
            gain.gain.setValueAtTime(0.04 / (idx + 1), now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + decay);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + decay);
          });
        } catch (e) {}
      }

      playRustle() {
        if (!this.ctx || !this.enabled) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.3);
          gain.gain.setValueAtTime(0.02, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch (e) {}
      }
    }

    const audio = new ZenAudio();

    // --------------------------------------------------------------------------
    // 2. CKB RPC CLIENT (Exact Cell Model Extraction)
    // --------------------------------------------------------------------------
    class CKBRpc {
      constructor() {
        this.httpUrl = localStorage.getItem('ckb_http_rpc') || CONFIG.defaultHttpRpc;
        this.wsUrl = localStorage.getItem('ckb_ws_rpc') || '';
        this.lastProcessedBlockHash = null;
        this.status = 'CONNECTING';
        this.pollTimer = null;
        this.onBlock = null;
        this.onStatus = null;
      }

      start(onBlock, onStatus) {
        this.onBlock = onBlock;
        this.onStatus = onStatus;
        this.connect();
      }

      setEndpoints(http, ws) {
        this.httpUrl = http.trim() || CONFIG.defaultHttpRpc;
        this.wsUrl = ws.trim();
        localStorage.setItem('ckb_http_rpc', this.httpUrl);
        localStorage.setItem('ckb_ws_rpc', this.wsUrl);
        this.reconnect();
      }

      reconnect() {
        if (this.pollTimer) clearInterval(this.pollTimer);
        this.connect();
      }

      async connect() {
        this.updateStatus('CONNECTING');
        try {
          const tip = await this.getTipHeader();
          if (tip && tip.hash) {
            this.lastProcessedBlockHash = tip.hash;
            const num = parseInt(tip.number, 16);
            this.updateStatus('LIVE');
            if (this.onBlock) this.onBlock(null, num);
          }
        } catch (e) {
          this.updateStatus('ERROR');
        }

        // Start HTTP polling
        if (this.pollTimer) clearInterval(this.pollTimer);
        this.pollTimer = setInterval(() => this.pollTip(), CONFIG.pollIntervalMs);
      }

      updateStatus(st) {
        this.status = st;
        if (this.onStatus) this.onStatus(st);
      }

      async rpcCall(method, params = []) {
        const body = JSON.stringify({ id: Date.now(), jsonrpc: '2.0', method, params });
        const res = await fetch(this.httpUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        return data.result;
      }

      async getTipHeader() {
        return await this.rpcCall('get_tip_header', []);
      }

      async getBlock(hash) {
        return await this.rpcCall('get_block', [hash]);
      }

      async pollTip() {
        try {
          const tip = await this.getTipHeader();
          if (tip && tip.hash && tip.hash !== this.lastProcessedBlockHash) {
            this.lastProcessedBlockHash = tip.hash;
            const fullBlock = await this.getBlock(tip.hash);
            if (fullBlock && fullBlock.transactions) {
              const cells = this.extractCells(fullBlock);
              const num = parseInt(tip.number, 16);
              if (this.onBlock) {
                this.onBlock({
                  blockNumber: num,
                  blockHash: tip.hash,
                  txCount: fullBlock.transactions.length,
                  cells: cells
                });
              }
            }
          }
        } catch (e) {}
      }

      /**
       * Strict CKB Cell Model Invariant:
       * newCellCount = sum(tx.outputs.length for all tx in block.transactions including cellbase)
       */
      extractCells(block) {
        const cells = [];
        if (!block || !Array.isArray(block.transactions)) return cells;
        for (const tx of block.transactions) {
          if (!Array.isArray(tx.outputs)) continue;
          for (let i = 0; i < tx.outputs.length; i++) {
            const out = tx.outputs[i];
            const data = (tx.outputs_data && tx.outputs_data[i]) ? tx.outputs_data[i] : '0x';
            cells.push({
              txHash: tx.hash,
              outputIndex: i,
              outPoint: `${tx.hash}:${i}`,
              capacity: out.capacity,
              hasType: out.type !== null,
              dataBytes: (data.length > 2) ? (data.length - 2) / 2 : 0
            });
          }
        }
        return cells;
      }
    }

    // --------------------------------------------------------------------------
    // 3. BONSAI SCENE, TREE & LEAF SYSTEM
    // --------------------------------------------------------------------------
    class BonsaiScene {
      constructor(canvas) {
        this.canvas = canvas;
        this.scene = null;
        this.camera = null;
        this.renderer = null;

        // Interaction
        this.cameraRadius = 15;
        this.cameraPhi = Math.PI * 0.38;
        this.cameraTheta = 0;
        this.targetCameraRadius = 15;
        this.autoRotateSpeed = 0.002;
        this.isInteracting = false;
        this.lastTouchX = 0;
        this.lastTouchY = 0;
        this.lastInteractionTime = Date.now();
        this.pinchDist = 0;

        // Bonsai & Foliage anchors
        this.canopyPositions = [];
        this.fallingLeaves = [];

        this.init();
      }

      init() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x090b10);
        this.scene.fog = new THREE.FogExp2(0x090b10, 0.035);

        const aspect = window.innerWidth / window.innerHeight;
        this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
        this.updateCamera();

        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          powerPreference: 'high-performance'
        });
        const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
        this.renderer.setPixelRatio(dpr);
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.2;

        this.setupLighting();
        this.buildJapaneseRoom();
        this.buildBonsaiStandAndPot();
        this.buildJapaneseMapleBonsai();

        this.bindEvents();
      }

      setupLighting() {
        // Soft ambient room tone
        const ambient = new THREE.AmbientLight(0x2a241e, 1.4);
        this.scene.add(ambient);

        // Key Light: Warm lantern illumination from above-right
        const keyLight = new THREE.DirectionalLight(0xffecd0, 1.8);
        keyLight.position.set(6, 12, 8);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        this.scene.add(keyLight);

        // Fill Light: Soft crimson rim light illuminating the maple canopy
        const rimLight = new THREE.PointLight(0xff5533, 1.5, 18);
        rimLight.position.set(-6, 8, -6);
        this.scene.add(rimLight);

        // Warm paper lantern glow underneath
        this.lanternGlow = new THREE.PointLight(0xffa726, 1.2, 10);
        this.lanternGlow.position.set(0, 3, 0);
        this.scene.add(this.lanternGlow);
      }

      buildJapaneseRoom() {
        // Tatami floor
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({
          color: 0x1a2118,
          roughness: 0.65,
          metalness: 0.05
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.05;
        floor.receiveShadow = true;
        this.scene.add(floor);

        // Tatami Border Inlays
        const borderMat = new THREE.MeshStandardMaterial({ color: 0x0a0c0a, roughness: 0.8 });
        for (let i = -2; i <= 2; i++) {
          const border = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 30), borderMat);
          border.position.set(i * 3.6, 0.01, 0);
          this.scene.add(border);
        }

        // Shoji Screen Backdrop
        const shojiGroup = new THREE.Group();
        const paperMat = new THREE.MeshStandardMaterial({
          color: 0xfff8ee,
          roughness: 0.9,
          emissive: 0x33261a,
          emissiveIntensity: 0.3
        });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x140e0a, roughness: 0.5 });

        const shojiPaper = new THREE.Mesh(new THREE.PlaneGeometry(16, 10), paperMat);
        shojiPaper.position.set(0, 5, -8);
        shojiGroup.add(shojiPaper);

        // Lattice wooden grid on Shoji screen
        for (let x = -8; x <= 8; x += 1.6) {
          const bar = new THREE.Mesh(new THREE.BoxGeometry(0.08, 10, 0.08), woodMat);
          bar.position.set(x, 5, -7.95);
          shojiGroup.add(bar);
        }
        for (let y = 1; y <= 9; y += 1.2) {
          const bar = new THREE.Mesh(new THREE.BoxGeometry(16, 0.08, 0.08), woodMat);
          bar.position.set(0, y, -7.95);
          shojiGroup.add(bar);
        }
        this.scene.add(shojiGroup);
      }

      buildBonsaiStandAndPot() {
        const group = new THREE.Group();

        // 1. Carved Wooden Display Stand (Daiza)
        const standMat = new THREE.MeshStandardMaterial({ color: 0x18100a, roughness: 0.35, metalness: 0.1 });
        const standTop = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.3, 3.8), standMat);
        standTop.position.y = 0.45;
        standTop.castShadow = true;
        group.add(standTop);

        // Stand curved feet
        const legGeo = new THREE.BoxGeometry(0.35, 0.45, 0.35);
        const offsets = [[-2.2, -1.5], [2.2, -1.5], [-2.2, 1.5], [2.2, 1.5]];
        offsets.forEach(([ox, oz]) => {
          const leg = new THREE.Mesh(legGeo, standMat);
          leg.position.set(ox, 0.225, oz);
          group.add(leg);
        });

        // 2. Traditional Ceramic Bonsai Pot
        const potMat = new THREE.MeshStandardMaterial({
          color: 0x0c2538, // Deep cobalt blue ceramic glaze
          roughness: 0.15,
          metalness: 0.2
        });
        const potGeo = new THREE.CylinderGeometry(2.1, 1.85, 1.1, 32);
        const pot = new THREE.Mesh(potGeo, potMat);
        pot.position.y = 1.15;
        pot.scale.set(1.15, 1.0, 0.85); // elegant oval shape
        pot.castShadow = true;
        group.add(pot);

        // Pot Decorative Lip
        const lipGeo = new THREE.TorusGeometry(2.15, 0.08, 16, 32);
        const lip = new THREE.Mesh(lipGeo, potMat);
        lip.position.y = 1.7;
        lip.rotation.x = Math.PI / 2;
        lip.scale.set(1.15, 0.85, 1.0);
        group.add(lip);

        // 3. Soil & Moss Mound
        const soilMat = new THREE.MeshStandardMaterial({ color: 0x1f1711, roughness: 0.9 });
        const soil = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 1.95, 0.15, 32), soilMat);
        soil.position.y = 1.62;
        soil.scale.set(1.12, 1.0, 0.82);
        group.add(soil);

        // Green velvet moss patches
        const mossMat = new THREE.MeshStandardMaterial({ color: 0x2e4a1d, roughness: 0.8 });
        for (let m = 0; m < 7; m++) {
          const moss = new THREE.Mesh(new THREE.SphereGeometry(0.35 + Math.random() * 0.2, 12, 12), mossMat);
          const ma = Math.random() * Math.PI * 2;
          const mr = 0.4 + Math.random() * 0.9;
          moss.position.set(Math.cos(ma) * mr * 1.1, 1.72, Math.sin(ma) * mr * 0.8);
          moss.scale.y = 0.25;
          group.add(moss);
        }

        this.scene.add(group);
      }

      buildJapaneseMapleBonsai() {
        this.treeGroup = new THREE.Group();
        const barkMat = new THREE.MeshStandardMaterial({
          color: 0x2d1f18,
          roughness: 0.75,
          metalness: 0.05
        });

        // Procedural Aged Trunk with natural Moyogi curves
        const trunkPoints = [
          new THREE.Vector3(0, 1.6, 0),
          new THREE.Vector3(0.25, 2.6, 0.1),
          new THREE.Vector3(-0.35, 3.8, -0.15),
          new THREE.Vector3(0.15, 5.0, 0.2),
          new THREE.Vector3(-0.1, 6.2, 0.0)
        ];
        const trunkCurve = new THREE.CatmullRomCurve3(trunkPoints);
        const trunkGeo = new THREE.TubeGeometry(trunkCurve, 32, 0.42, 16, false);
        const trunkMesh = new THREE.Mesh(trunkGeo, barkMat);
        trunkMesh.castShadow = true;
        this.treeGroup.add(trunkMesh);

        // Main Boughs
        const branchConfigs = [
          { start: new THREE.Vector3(0.25, 2.8, 0.1), end: new THREE.Vector3(2.4, 3.8, 0.8), r: 0.24 },
          { start: new THREE.Vector3(-0.3, 3.9, -0.1), end: new THREE.Vector3(-2.6, 4.8, -0.6), r: 0.22 },
          { start: new THREE.Vector3(0.1, 4.9, 0.15), end: new THREE.Vector3(1.8, 6.0, -0.8), r: 0.18 },
          { start: new THREE.Vector3(-0.05, 5.8, 0.05), end: new THREE.Vector3(-1.4, 6.8, 0.9), r: 0.15 },
          { start: new THREE.Vector3(-0.1, 6.2, 0.0), end: new THREE.Vector3(0.0, 7.6, 0.1), r: 0.14 } // Apex
        ];

        branchConfigs.forEach(b => {
          const mid = b.start.clone().lerp(b.end, 0.5);
          mid.y += 0.35;
          const curve = new THREE.CatmullRomCurve3([b.start, mid, b.end]);
          const geo = new THREE.TubeGeometry(curve, 20, b.r, 12, false);
          const mesh = new THREE.Mesh(geo, barkMat);
          mesh.castShadow = true;
          this.treeGroup.add(mesh);

          // Add dense foliage clusters at end and along branch
          this.createMapleFoliageCluster(b.end, 1.4);
          this.createMapleFoliageCluster(mid, 1.1);
        });

        // Additional sub-apex clusters
        this.createMapleFoliageCluster(new THREE.Vector3(0.6, 7.2, 0.3), 1.3);
        this.createMapleFoliageCluster(new THREE.Vector3(-0.7, 7.3, -0.2), 1.3);
        this.createMapleFoliageCluster(new THREE.Vector3(0.0, 8.1, 0.0), 1.5); // Crown

        this.scene.add(this.treeGroup);
      }

      createMapleFoliageCluster(center, radius) {
        // Autumn Japanese Maple Leaf Palette: Crimson, Scarlet, Amber, Burnt Orange
        const mapleColors = [0xd32f2f, 0xc2185b, 0xe65100, 0xff8f00, 0xb71c1c];
        const leafGeo = new THREE.PlaneGeometry(0.36, 0.36);

        const leafCount = 45;
        for (let i = 0; i < leafCount; i++) {
          const col = mapleColors[Math.floor(Math.random() * mapleColors.length)];
          const leafMat = new THREE.MeshStandardMaterial({
            color: col,
            roughness: 0.45,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.92
          });

          const leaf = new THREE.Mesh(leafGeo, leafMat);
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const r = radius * Math.cbrt(Math.random());

          const pos = new THREE.Vector3(
            center.x + r * Math.sin(phi) * Math.cos(theta),
            center.y + r * Math.sin(phi) * Math.sin(theta) * 0.7,
            center.z + r * Math.cos(phi)
          );

          leaf.position.copy(pos);
          leaf.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          this.treeGroup.add(leaf);

          // Register position as anchor for falling leaves
          this.canopyPositions.push(pos.clone());
        }
      }

      spawnFallingLeaves(count) {
        audio.playTempleBell();

        // Shimmer lantern illumination
        this.lanternGlow.intensity = 2.4;

        // Animate count in waves if large block
        const total = count;
        const waveSize = Math.min(30, Math.ceil(total / 3));
        let spawned = 0;

        const spawnWave = () => {
          const toSpawn = Math.min(waveSize, total - spawned);
          for (let i = 0; i < toSpawn; i++) {
            this.createFallingLeaf();
          }
          spawned += toSpawn;
          audio.playRustle();

          if (spawned < total) {
            setTimeout(spawnWave, 350);
          }
        };

        spawnWave();
      }

      createFallingLeaf() {
        if (this.canopyPositions.length === 0) return;

        // Choose random anchor from canopy
        const anchor = this.canopyPositions[Math.floor(Math.random() * this.canopyPositions.length)];
        const mapleColors = [0xd32f2f, 0xe65100, 0xff8f00, 0xc2185b];
        const col = mapleColors[Math.floor(Math.random() * mapleColors.length)];

        // Leaf geometry (stylized 5-lobed maple leaf)
        const geo = new THREE.PlaneGeometry(0.38, 0.38);
        const mat = new THREE.MeshStandardMaterial({
          color: col,
          roughness: 0.35,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.95
        });

        const leafMesh = new THREE.Mesh(geo, mat);
        leafMesh.position.copy(anchor);

        const leaf = {
          mesh: leafMesh,
          mat: mat,
          geo: geo,
          velX: (Math.random() - 0.5) * 0.02,
          velY: -0.025 - Math.random() * 0.02,
          velZ: (Math.random() - 0.5) * 0.02,
          rotX: (Math.random() - 0.5) * 0.06,
          rotY: (Math.random() - 0.5) * 0.08,
          rotZ: (Math.random() - 0.5) * 0.06,
          swayFreq: 2.0 + Math.random() * 2.0,
          swayAmp: 0.03 + Math.random() * 0.02,
          age: 0,
          maxAge: 7.0 + Math.random() * 3.0
        };

        this.scene.add(leafMesh);
        this.fallingLeaves.push(leaf);
      }

      updateLeaves(dt, time) {
        // Smoothly relax lantern glow
        this.lanternGlow.intensity += (1.2 - this.lanternGlow.intensity) * 0.03;

        for (let i = this.fallingLeaves.length - 1; i >= 0; i--) {
          const l = this.fallingLeaves[i];
          l.age += dt;

          // Natural fluttering autumn drift
          l.mesh.position.y += l.velY;
          l.mesh.position.x += l.velX + Math.sin(time * l.swayFreq) * l.swayAmp;
          l.mesh.position.z += l.velZ + Math.cos(time * l.swayFreq * 0.7) * l.swayAmp;

          // Tumbling rotation
          l.mesh.rotation.x += l.rotX;
          l.mesh.rotation.y += l.rotY;
          l.mesh.rotation.z += l.rotZ;

          // Fade out near floor or when aged
          if (l.mesh.position.y < 0.2 || l.age > l.maxAge) {
            l.mat.opacity -= 0.025;
            if (l.mat.opacity <= 0.01) {
              this.scene.remove(l.mesh);
              l.geo.dispose();
              l.mat.dispose();
              this.fallingLeaves.splice(i, 1);
            }
          }
        }
      }

      updateCamera() {
        this.camera.position.x = this.cameraRadius * Math.sin(this.cameraPhi) * Math.sin(this.cameraTheta);
        this.camera.position.y = this.cameraRadius * Math.cos(this.cameraPhi);
        this.camera.position.z = this.cameraRadius * Math.sin(this.cameraPhi) * Math.cos(this.cameraTheta);
        this.camera.lookAt(0, 4.6, 0); // Focus on bonsai canopy
      }

      bindEvents() {
        const dom = this.canvas;

        // Pointer Drag Orbit
        dom.addEventListener('pointerdown', (e) => {
          this.isInteracting = true;
          this.lastTouchX = e.clientX;
          this.lastTouchY = e.clientY;
          this.lastInteractionTime = Date.now();
        });

        window.addEventListener('pointermove', (e) => {
          if (!this.isInteracting) return;
          const dx = e.clientX - this.lastTouchX;
          const dy = e.clientY - this.lastTouchY;
          this.lastTouchX = e.clientX;
          this.lastTouchY = e.clientY;
          this.lastInteractionTime = Date.now();

          this.cameraTheta -= dx * 0.007;
          this.cameraPhi = Math.max(0.18, Math.min(Math.PI * 0.46, this.cameraPhi - dy * 0.007));
          this.updateCamera();
        });

        window.addEventListener('pointerup', () => {
          this.isInteracting = false;
        });

        // Wheel Zoom (Rotary crown input)
        dom.addEventListener('wheel', (e) => {
          e.preventDefault();
          this.lastInteractionTime = Date.now();
          this.cameraTheta += e.deltaY * 0.0006;
          this.updateCamera();
        }, { passive: false });

        // Native Wear OS rotary event
        window.addEventListener('wearRotary', (e) => {
          if (e.detail && typeof e.detail.delta === 'number') {
            this.cameraTheta += e.detail.delta * 0.05;
            this.updateCamera();
          }
        });

        // Pinch Zoom
        dom.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            this.pinchDist = Math.hypot(dx, dy);
          }
        }, { passive: true });

        dom.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const delta = (this.pinchDist - dist) * 0.02;
            this.pinchDist = dist;
            this.targetCameraRadius = Math.max(9.0, Math.min(24.0, this.targetCameraRadius + delta));
            this.lastInteractionTime = Date.now();
          }
        }, { passive: true });

        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      update(time, dt) {
        // Zoom interpolation
        if (Math.abs(this.targetCameraRadius - this.cameraRadius) > 0.01) {
          this.cameraRadius += (this.targetCameraRadius - this.cameraRadius) * 0.1;
          this.updateCamera();
        }

        // Gentle auto rotation like museum display turntable
        if (!this.isInteracting && (Date.now() - this.lastInteractionTime) > 2500) {
          this.cameraTheta += this.autoRotateSpeed;
          this.updateCamera();
        }

        // Update falling leaves
        this.updateLeaves(dt, time);

        this.renderer.render(this.scene, this.camera);
      }
    }

    // --------------------------------------------------------------------------
    // 4. UI CONTROLLER & LIFECYCLE
    // --------------------------------------------------------------------------
    const canvas = document.getElementById('webgl-canvas');
    const bonsaiScene = new BonsaiScene(canvas);
    const ckb = new CKBRpc();

    const elBlock = document.getElementById('blockNumber');
    const elDot = document.getElementById('statusDot');
    const elCells = document.getElementById('cellsCount');
    const elBanner = document.getElementById('zenBanner');
    const elBannerMain = document.getElementById('bannerMain');
    const settingsModal = document.getElementById('settingsModal');

    // UI Buttons
    document.getElementById('settingsBtn').onclick = () => settingsModal.classList.add('open');
    document.getElementById('closeSettingsBtn').onclick = () => settingsModal.classList.remove('open');
    document.getElementById('audioBtn').onclick = () => {
      const on = audio.toggle();
      document.getElementById('audioIconOn').style.display = on ? 'block' : 'none';
      document.getElementById('audioIconOff').style.display = on ? 'none' : 'block';
    };

    document.getElementById('saveRpcBtn').onclick = () => {
      const http = document.getElementById('rpcInput').value;
      const ws = document.getElementById('wsInput').value;
      ckb.setEndpoints(http, ws);
      settingsModal.classList.remove('open');
    };

    document.getElementById('testBlockBtn').onclick = () => {
      settingsModal.classList.remove('open');
      const count = 12 + Math.floor(Math.random() * 28);
      handleNewBlock({
        blockNumber: 17234568 + Math.floor(Math.random() * 100),
        txCount: Math.ceil(count / 3),
        cells: Array.from({ length: count })
      });
    };

    let bannerTimeout = null;
    function handleNewBlock(data) {
      if (!data) return;
      elBlock.textContent = `#${data.blockNumber.toLocaleString()}`;
      elCells.textContent = data.cells.length.toLocaleString();

      elBannerMain.textContent = `${data.cells.length} NEW CELLS`;
      elBanner.classList.add('visible');
      clearTimeout(bannerTimeout);
      bannerTimeout = setTimeout(() => elBanner.classList.remove('visible'), 4000);

      // Trigger leaf fall
      bonsaiScene.spawnFallingLeaves(data.cells.length);
    }

    // Start CKB Connection
    ckb.start(
      (data, tipNum) => {
        if (tipNum) {
          elBlock.textContent = `#${tipNum.toLocaleString()}`;
        } else if (data) {
          handleNewBlock(data);
        }
      },
      (status) => {
        elDot.className = 'pulse-dot ' + (status === 'LIVE' ? 'live' : (status === 'ERROR' ? 'error' : ''));
      }
    );

    // Frame Loop
    let lastT = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = (now - lastT) * 0.001;
      lastT = now;
      bonsaiScene.update(now * 0.001, dt);
    }
    requestAnimationFrame(loop);
  </script>
</body>
